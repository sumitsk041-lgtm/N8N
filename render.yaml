services:
  - type: web
    name: content-engine-n8n
    runtime: docker
    dockerfilePath: ./n8n/Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: N8N_HOST
        value: 0.0.0.0
      - key: N8N_PORT
        value: 5678
      - key: N8N_PROTOCOL
        value: https
      - key: GENERIC_TIMEZONE
        value: Asia/Kolkata
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: N8N_SECURE_COOKIE
        value: "true"
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: content-engine-n8n-db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: content-engine-n8n-db
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: content-engine-n8n-db
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: content-engine-n8n-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: content-engine-n8n-db
          property: password

databases:
  - name: content-engine-n8n-db
    plan: free
